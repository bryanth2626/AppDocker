<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <h1>Hola bro</h1>

  <form id="uploadForm">
    <div>
      <label for="imagen">Seleccione Imagen</label>
      <input type="file" name="imagen" id="imagen" accept="image/*" required">
    </div>
    <button type="submit">Enviar</button>
  </form>

  <div>
    <h3>Resultados del análisis</h3>
    <ul id="listaEtiquetas"></ul>
  </div>
    <!-- TEXTRACT: SUBIR PDF -->

  <hr>

  <h2>Reconocimiento de texto en PDF</h2>

  <form id="pdfForm">
    <div>
      <label for="documento">Seleccione un PDF (menos de 5 MB)</label>
      <input type="file" name="documento" id="documento"
        accept="application/pdf" required>
    </div>

    <button type="submit">Analizar PDF</button>
  </form>

  <div>
    <h3>Resultado de Textract</h3>
    <p id="mensajePDF"></p>
    <ul id="listaTexto"></ul>
  </div>

  <script src="js/rekognition.js"></script>
  <script src="js/extract_pdf.js"></script>


</body>
</html>
