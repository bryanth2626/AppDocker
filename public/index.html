<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <h1>Hola bro</h1>

  <form id="uploadForm">
    <div>
      <label for="imagen">Seleccione Imagen</label>
      <input type="file" name="imagen" id="imagen" accept="image/*" required">
    </div>
    <button type="submit">Enviar</button>
  </form>

  <div>
    <h3>Resultados del análisis</h3>
    <ul id="listaEtiquetas"></ul>
  </div>

  <script>
    const form= document.getElementById("uploadForm")
    const listaEtiquetas = document.getElementById("listaEtiquetas")

    form.addEventListener("submit", async(e)=>{
      e.preventDefault() //Detenemos el envío

      //FORMDATA= contenedor de datos
      const formData = new FormData(form)

      listaEtiquetas.innerHTML = `<li>Analizando imagen con AWS...<li>`

      //Enviar los datos por la API...
      try{
        const response = await fetch('api/analizar', {
          method: 'POST',
          body: formData
        })
        //El servicio AWS inicia la resolucion..
        const data = await response.json()
        if (data.success){
          listaEtiquetas.innerHTML = ``
          data.labels.forEach(label => {
            const li = document.createElement("li")
            li.textContent = `Etiqueta: ${label.Name} - Confianza: ${label.Confidence.toFixed(2)}%`
            listaEtiquetas.appendChild(li) // <-- ESTA LÍNEA ES OBLIGATORIA
          })
        }else{
          //CUIDADO: No se deben exponer todos los errores
          //¿Como se manejan los errores en backend?
          listaEtiquetas.innerHTML=`
            <li>${data.error}</li>
            <li>${data.details}</li>  
            <li>${data.code}</li>  
          
          `
        }

      }catch(error){
        console.error(error)
        listaEtiquetas.innerHTML= `<li>Error de conexion<li>`
      } 
    })
  </script>
</body>
</html>
